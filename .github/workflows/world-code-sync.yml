name: Build and verify World Code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  world-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated output on pull requests
        if: github.event_name == 'pull_request'
        run: npm run check

      - name: Test scheduler and lobby behavior
        run: npm test

      - name: Regenerate World Code after changes on main
        if: github.event_name == 'push'
        run: npm run build

      - name: Commit generated World Code when it changed
        if: github.event_name == 'push'
        run: |
          git add world-code/worldCode.js
          if git diff --cached --quiet; then
            echo "world-code/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync compact World Code from src"
          git push
